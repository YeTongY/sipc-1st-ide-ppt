# 静态托管 Slidev 构建产物
# 说明：dist/_redirects 里的 `/* /index.html 200`（SPA 回退）在这里由 try_files 实现。

# 带 hash 的构建产物可长期缓存；入口 HTML 必须每次校验，避免发版后拿到旧壳子
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    add_header Cache-Control        $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy      strict-origin-when-cross-origin always;

    # 压缩：Slidev 的 JS/CSS 体积较大，收益明显
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/wasm font/ttf font/otf;

    # 前端路由回退：/3、/7 之类的幻灯片路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缺失时直接 404，不要回退成 HTML（否则浏览器会拿到 text/html 的 JS）
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
