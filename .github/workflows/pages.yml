name: Deploy deck to GitHub Pages

# 项目页地址是 yetongy.github.io/<repo>/，所以构建时必须带 --base，
# 否则 dist 里的 /assets/... 绝对路径会在子目录下 404。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts：跳过 playwright-chromium 的浏览器下载（导出 PDF 才需要）
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Slidev (base = 项目页子路径)
        run: pnpm exec slidev build --base "/${{ github.event.repository.name }}/" --out dist-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
